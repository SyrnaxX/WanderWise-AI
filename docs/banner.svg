<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.6" stop-color="#14274e"/>
      <stop offset="1" stop-color="#e8885a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd8a8"/>
      <stop offset="1" stop-color="#ff9e5e"/>
    </linearGradient>
  </defs>
  <style>
    .star { animation: twinkle 3s ease-in-out infinite; fill: #fff; }
    .s2 { animation-delay: .8s } .s3 { animation-delay: 1.6s } .s4 { animation-delay: 2.2s }
    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .cloud { fill: #fff; opacity: .16; animation: drift 38s linear infinite; }
    .c2 { animation-duration: 55s; opacity: .1; }
    @keyframes drift { from { transform: translateX(-300px) } to { transform: translateX(1500px) } }
    .sun { animation: glow 6s ease-in-out infinite; transform-origin: 900px 250px; }
    @keyframes glow { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.08); opacity: 1 } }
    .ttl { font: 800 68px 'Segoe UI', Arial, sans-serif; fill: url(#title); animation: rise 1.6s ease-out both; }
    .tag { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #cfe0ff; letter-spacing: 4px; animation: rise 1.6s .5s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: translateY(0) } }
    .needle { transform-origin: 1090px 70px; animation: spin 7s ease-in-out infinite; }
    @keyframes spin { 0%,100% { transform: rotate(-25deg) } 50% { transform: rotate(35deg) } }
  </style>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle class="star" cx="120" cy="50" r="2"/><circle class="star s2" cx="300" cy="90" r="1.5"/>
  <circle class="star s3" cx="520" cy="40" r="2"/><circle class="star s4" cx="760" cy="70" r="1.5"/>
  <circle class="star" cx="980" cy="35" r="2"/><circle class="star s3" cx="1150" cy="110" r="1.5"/>
  <circle class="star s2" cx="640" cy="120" r="1.5"/>
  <circle class="sun" cx="900" cy="250" r="70" fill="#ffb27a" opacity=".85"/>
  <ellipse class="cloud" cx="0" cy="90" rx="110" ry="22"/>
  <ellipse class="cloud c2" cx="0" cy="150" rx="150" ry="26"/>
  <path d="M0 250 L140 150 L240 220 L380 110 L520 230 L650 140 L800 235 L960 130 L1100 220 L1200 170 L1200 320 L0 320Z" fill="#1d2f57" opacity=".9"/>
  <path d="M0 290 L180 210 L320 270 L470 195 L620 275 L780 205 L940 280 L1090 220 L1200 265 L1200 320 L0 320Z" fill="#0b1226"/>
  <text class="ttl" x="60" y="160">WanderWise AI</text>
  <text class="tag" x="64" y="205">EXPLORE SMARTER. TRAVEL BETTER.</text>
  <g>
    <circle cx="1090" cy="70" r="34" fill="none" stroke="#ffd8a8" stroke-width="3" opacity=".8"/>
    <g class="needle"><polygon points="1090,42 1098,70 1090,98 1082,70" fill="#ff9e5e"/></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
